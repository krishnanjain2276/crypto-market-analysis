[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab"
version = "1.1.0"
description = "Crypto market research toolkit: indicators, HMM regimes, risk, portfolio construction and leak-free backtests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Bhavesh" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cryptolab = "cryptolab.__main__:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# h, l, c, v for high/low/close/volume and A, S for matrices are standard in this kind of code
ignore = ["E741", "B905"]
